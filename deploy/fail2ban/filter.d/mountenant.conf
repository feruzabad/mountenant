# fail2ban filter for the Mountenant security log (specification §7.8).
#
# Line format (public contract, see CHANGELOG for changes):
#   <RFC 3339 UTC> mountenant event=<name> ip=<client ip> user="<username>" reason=<code>
#
# Matched events: failed logins (unknown user and wrong password produce the
# same line) and invalid or expired download links.

[Definition]

failregex = ^ mountenant event=(?:auth_failure|link_invalid) ip=<HOST> user="(?:[^"\\]|\\.)*" reason=[a-z0-9_]+$

ignoreregex =

datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%SZ
