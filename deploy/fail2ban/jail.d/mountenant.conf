# Example jail; copy to /etc/fail2ban/jail.d/ and adjust.
# The IP in the log is the real client IP resolved through the trusted
# proxies, so banning it does not ban the reverse proxy. If the proxy runs
# on the same host, ban with an action that matches X-Forwarded-For at the
# proxy, or block the client before the proxy (e.g. nftables on the host).

[mountenant]
enabled  = true
filter   = mountenant
logpath  = /var/log/mountenant/security.log
backend  = auto
maxretry = 10
findtime = 10m
bantime  = 1h
