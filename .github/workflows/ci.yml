name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1"
      - name: generated code is up to date
        run: make generate SQLC=sqlc && git diff --exit-code
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./... && go vet -tags live ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - name: test
        # Failing tests are also reported as annotations, so their output is
        # visible without access to the job log.
        run: |
          set +e
          go test -race -json ./... > test.json
          status=$?
          jq -r 'select(.Action == "output") | .Output' test.json | grep -v '^=== \|^--- PASS\|^PASS$\|^ok ' || true
          jq -r -s '
            group_by(.Package + " " + (.Test // ""))
            | map(select(any(.[]; .Action == "fail")))
            | .[]
            | "::error title=\(.[0].Package) \(.[0].Test // "(package)")::"
              + ([.[] | select(.Action == "output") | .Output] | join("") | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A"))
          ' test.json
          exit $status
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: build
        run: make build

  fail2ban:
    # The security log format is a public contract (spec 7.8): the shipped
    # filter must match exactly the failure lines in the sample. fail2ban is
    # run from its pinned, checksummed source release; installing it with
    # apt repeatedly hung on runner mirrors.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FAIL2BAN_VERSION: "1.1.0"
      FAIL2BAN_SHA256: 474fcc25afdaf929c74329d1e4d24420caabeea1ef2e041a267ce19269570bae
    steps:
      - uses: actions/checkout@v7
      - name: fetch fail2ban
        run: |
          curl -sSfL -o "$RUNNER_TEMP/f2b.tar.gz" "https://github.com/fail2ban/fail2ban/archive/refs/tags/$FAIL2BAN_VERSION.tar.gz"
          echo "$FAIL2BAN_SHA256  $RUNNER_TEMP/f2b.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/f2b.tar.gz" -C "$RUNNER_TEMP"
      - name: fail2ban-regex
        run: |
          out=$(python3 -I -c 'import sys; sys.path.insert(0, sys.argv.pop(1)); from fail2ban.client.fail2banregex import exec_command_line; exec_command_line(sys.argv)' \
            "$RUNNER_TEMP/fail2ban-$FAIL2BAN_VERSION" deploy/fail2ban/sample.log deploy/fail2ban/filter.d/mountenant.conf)
          echo "$out"
          echo "$out" | grep -q "Lines: 7 lines, 0 ignored, 3 matched, 4 missed"
