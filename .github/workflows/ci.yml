name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1"
      - name: generated code is up to date
        run: make generate SQLC=sqlc && git diff --exit-code
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./... && go vet -tags live ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - name: test
        # Failing tests are also reported as annotations, so their output is
        # visible without access to the job log.
        run: |
          set +e
          go test -race -json ./... > test.json
          status=$?
          jq -r 'select(.Action == "output") | .Output' test.json | grep -v '^=== \|^--- PASS\|^PASS$\|^ok ' || true
          jq -r -s '
            group_by(.Package + " " + (.Test // ""))
            | map(select(any(.[]; .Action == "fail")))
            | .[]
            | "::error title=\(.[0].Package) \(.[0].Test // "(package)")::"
              + ([.[] | select(.Action == "output") | .Output] | join("") | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A"))
          ' test.json
          exit $status
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: build
        run: make build

  fail2ban:
    # The security log format is a public contract (spec 7.8): the shipped
    # filter must match exactly the failure lines in the sample.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fail2ban
      - name: fail2ban-regex
        run: |
          out=$(fail2ban-regex deploy/fail2ban/sample.log deploy/fail2ban/filter.d/mountenant.conf)
          echo "$out"
          echo "$out" | grep -q "Lines: 7 lines, 0 ignored, 3 matched, 4 missed"
